[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "insta-edits"
version = "0.1.0"
description = "Connect Claude Code and other MCP clients to Instagram Edits for Mac's automation server."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Faisal Khan" }]
keywords = ["mcp", "model-context-protocol", "instagram", "edits", "reels", "video-editing", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/faisalkhanzemi/insta-edits-for-claude"
Issues = "https://github.com/faisalkhanzemi/insta-edits-for-claude/issues"
Changelog = "https://github.com/faisalkhanzemi/insta-edits-for-claude/blob/main/CHANGELOG.md"

[project.scripts]
insta-edits = "insta_edits.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/insta_edits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional, readable on Python 3.9
